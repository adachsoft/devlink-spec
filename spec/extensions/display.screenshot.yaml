openapi: 3.1.0
info:
  title: devlink extension display.screenshot
  version: '0.1.0'
  description: >-
    Requires the `ext:display.screenshot` scope. Its state is also reported as
    the same object under `extensions["display.screenshot"]` in `GET /v1/status`.
    This is a sensitive, semantic cross-platform capability for capturing the
    current screen. It is disabled by default and must be explicitly enabled
    on the device.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://{host}:{port}
    description: Default LAN server.
    variables:
      host:
        default: devlink.local
        description: Hostname or IP address of the devlink agent.
      port:
        default: '8787'
        description: HTTP port used by the devlink agent.
security:
  - bearerAuth: []
tags:
  - name: display.screenshot
    description: Capture the current screen.
paths:
  /ext/display.screenshot/v1/state:
    get:
      tags:
        - display.screenshot
      operationId: getScreenshotState
      summary: Get screenshot state
      description: Returns whether the current screen can be captured and the platform's capture constraints.
      responses:
        '200':
          description: Current screenshot state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenshotState'
        '401':
          $ref: '../components/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../components/responses.yaml#/components/responses/Forbidden'
        default:
          $ref: '../components/responses.yaml#/components/responses/UnexpectedError'
  /ext/display.screenshot/v1/image:
    get:
      tags:
        - display.screenshot
      operationId: captureScreenshot
      summary: Capture the current screen
      description: Captures and returns the current screen as an image.
      parameters:
        - name: format
          in: query
          required: false
          description: Requested screenshot image format.
          schema:
            type: string
            enum:
              - png
              - jpeg
            default: png
        - name: quality
          in: query
          required: false
          description: JPEG quality between 1 and 100; used only when format is jpeg.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 90
        - name: display
          in: query
          required: false
          description: Display index to capture.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Captured screenshot image.
          headers:
            X-Screenshot-Width:
              description: Width of the captured image in pixels.
              schema:
                type: integer
            X-Screenshot-Height:
              description: Height of the captured image in pixels.
              schema:
                type: integer
            X-Screenshot-Timestamp:
              description: Time when the screenshot was captured.
              schema:
                type: string
                format: date-time
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '400':
          description: A query parameter is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/Problem'
              examples:
                invalidParameter:
                  summary: Invalid image format
                  value:
                    type: about:blank
                    title: Invalid parameter
                    status: 400
                    code: invalid-parameter
                    detail: The format parameter must be either png or jpeg.
        '401':
          $ref: '../components/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../components/responses.yaml#/components/responses/Forbidden'
        '409':
          description: The screen cannot be captured at this time.
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/Problem'
              examples:
                serviceNotEnabled:
                  summary: Screenshot service is not enabled
                  value:
                    type: about:blank
                    title: Screenshot service not enabled
                    status: 409
                    code: service-not-enabled
                    detail: On Android, the user must enable the devlink accessibility service in system settings.
                secureContent:
                  summary: Protected screen content is visible
                  value:
                    type: about:blank
                    title: Protected content cannot be captured
                    status: 409
                    code: secure-content
                    detail: The screen is showing protected content and cannot be captured.
        '429':
          description: A screenshot was requested before the minimum capture interval had elapsed.
          headers:
            Retry-After:
              description: Number of seconds the client should wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/Problem'
              examples:
                rateLimited:
                  summary: Screenshot requests are too frequent
                  value:
                    type: about:blank
                    title: Too many requests
                    status: 429
                    code: rate-limited
                    detail: Wait before requesting another screenshot.
        default:
          $ref: '../components/responses.yaml#/components/responses/UnexpectedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ScreenshotState:
      type: object
      description: Current screen capture availability and platform constraints.
      required:
        - available
        - method
        - reason
        - minIntervalMs
      properties:
        available:
          type: boolean
          description: Whether a screen capture can be performed right now.
        method:
          type: [string, 'null']
          description: Platform capture mechanism, such as accessibility-service on Android, or null when unknown.
        reason:
          type: [string, 'null']
          description: Machine-readable reason capture is unavailable, such as service-not-enabled; null when available is true.
        minIntervalMs:
          type: [integer, 'null']
          minimum: 0
          description: Minimum interval between captures enforced by the platform in milliseconds, or null when the platform does not report a limit.
